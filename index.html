<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大阪防災マップ</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">大阪府向け防災アプリ</p>
            <h1>大阪防災マップ</h1>
          </div>
          <button id="locateBtn" class="primary-btn">現在地を取得</button>
        </div>

        <div class="filter-group">
          <label>
            区域
            <select id="districtFilter">
              <option value="all">すべて</option>
              <option value="北区">北区</option>
              <option value="中央区">中央区</option>
              <option value="天王寺区">天王寺区</option>
              <option value="浪速区">浪速区</option>
              <option value="住之江区">住之江区</option>
              <option value="大阪市西部">大阪市西部</option>
            </select>
          </label>
        </div>

        <div class="toggle-row">
          <label class="check-item">
            <input type="checkbox" id="showFlood" checked />
            洪水リスク
          </label>
          <label class="check-item">
            <input type="checkbox" id="showLandslide" checked />
            土砂災害
          </label>
        </div>

        <div id="statusBanner" class="status-banner">
          情報更新: 2026/11/06 09:00
        </div>

        <div class="legend">
          <div><span class="dot flood"></span>洪水リスク</div>
          <div><span class="dot landslide"></span>土砂災害</div>
          <div><span class="dot shelter"></span>避難所</div>
        </div>

        <div class="list-header">
          <h2>避難所一覧</h2>
          <span id="countLabel">0件</span>
        </div>
        <div id="shelterList" class="shelter-list" aria-live="polite"></div>
      </aside>

      <main class="map-panel">
        <div id="map" aria-label="避難所マップ"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
